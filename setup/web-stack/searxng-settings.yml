use_default_settings: true

general:
  instance_name: "Private local SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  # Replaced with a fresh random value by install-web-stack.sh
  secret_key: "CHANGE_ME"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
